<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/calculadora.css">
        <link id="tema-oscuro" rel="stylesheet" href="css/oscuro.css" disabled>
        <script src="js/cambiarmodo.js" defer></script>
        <script src="js/calculadora.js" defer></script>
    </head>

    <body>
        <!-- HEADER (CABECERA)-->
    <div id="header">
        <header>
        <h1>CALCULADORA</h1>
        <h2>Menú:</h2>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="formulario.html">Formulario</a>
            <a href="horario.html">Horario</a>
            <a href="calculadora.html">Calculadora</a>
            <a href="PiedraPapelTijera.html">Juego</a>
            <a href="EstilosJVS.html">Estilos JVS</a>
            <a href="generadorip.html">Generador de IPs</a>
            <button type="button" class="theme-toggle" data-cambiar-modo aria-pressed="false" onclick="cambiarModo()">Modo oscuro</button>
        </nav>
    </header>
    </div> 
        <div class="calculadora">
            <input type="text" id="pantalla" class="pantalla" value="0" readonly>

            <div class="teclas">
                <button class="tecla--operador" onclick="borrar()">C</button>
                <button onclick="escribir('1')">1</button>
                <button onclick="escribir('2')">2</button>
                <button onclick="escribir('3')">3</button>
                <button class="tecla--operador" onclick="escribir('+')">+</button>

                <button onclick="escribir('4')">4</button>
                <button onclick="escribir('5')">5</button>
                <button onclick="escribir('6')">6</button>
                <button class="tecla--operador" onclick="escribir('-')">-</button>

                <button onclick="escribir('7')">7</button>
                <button onclick="escribir('8')">8</button>
                <button onclick="escribir('9')">9</button>
                <button class="tecla--operador" onclick="escribir('/')">/</button>

                <button onclick="escribir('0')">0</button>
                <button onclick="escribir('.')">.</button>
                <button class="tecla--igual" onclick="calcular()">=</button>
                <button class="tecla--operador" onclick="escribir('*')">*</button>
            </div>
        </div>
    </body>
</html>
