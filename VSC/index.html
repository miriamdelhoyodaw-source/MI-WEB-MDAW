<!DOCTYPE html>
<html lang="es">
    <header>
        <meta charset="UTF-8">
        <title>Horario Miriam Daw1</title>
        <link rel="stylesheet" href="style.css">
    </header>
    <body>

        <main>
            <table border="6">
                <tr class="fila1">
                    <td>Hora</td>
                    <td>Lunes</td>
                    <td>Martes</td>
                    <td>Miércoles</td>
                    <td>Jueves</td>
                    <td>Viernes</td>
                </tr>

                <tbody>
                    <tr> <!--Clases de 1ª hora-->
                        <td class="hora">8:30 a 9:25</td>
                        <td class="PROG" rowspan="2">Programación</td> 
                        <!-- identificamos "PROG" para identificar en css, Rowspan fusiona celdas para abajo-->
                        <td class="SINF">Sistemas Informáticos</td>
                        <td class="BD" rowspan="2">Base de Datos</td>
                        <td class="PROG" rowspan="2">Programación</td>
                        <td class="LIBRE" rowspan="2">LIBRE</td>
                    </tr>

                    <tr> <!-- Clases de 2º hora-->
                        <td class="hora">9:25 a 10:20</td>
                        <td class="LIBRE">LIBRE</td>
                        <!--Las demás clases están creadas por el tr anterior-->
                    </tr>

                    <tr> <!--Clases de 3ª hora-->
                        <td class="hora">10:20 a 11:15</td>
                        <td class="PROYEC">PROYECTO</td>
                        <td class="BD">Base de Datos</td>
                        <td class="LMSGI">Lenguaje de Marcas</td>
                        <td class="SINF">Sistemas Informátiicos</td>
                        <td class="LMSGI">Lenguaje de Marcas</td>
                    </tr>

                    <tr> <!--RECREO-->
                        <td class="hora">11:15 a 11:45</td>
                        <td class="RECREO" colspan="5">RECREO</td>
                        <!-- COLSPAN fusiona las celdas hacia la derecha-->
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
